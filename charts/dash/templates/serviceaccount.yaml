{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dash.serviceAccountName" . }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The pod spec decides whether a token is mounted (only when an rbac flag gives dash API access).
automountServiceAccountToken: false
{{- end }}
