{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dash.fullname" . }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dash.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # The served port: dash, or the proxy with the sidecar (dash then listens on the loopback).
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if include "dash.direct" . }}
    # routes.direct: dash's own port, from the same sources as the served port.
    - ports:
        - port: direct
          protocol: TCP
      {{- with .Values.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    # /healthz and /readyz for the kubelet's probes and monitoring.
    - ports:
        - port: health
          protocol: TCP
{{- end }}
