apiVersion: v1
kind: Service
metadata:
  name: {{ include "dash.fullname" . }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "dash.selectorLabels" . | nindent 4 }}
  ports:
    # The container port named http: dash's, or the proxy's with the sidecar.
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if include "dash.direct" . }}
    # routes.direct: dash itself, past the sidecar.
    - name: direct
      port: {{ include "dash.directServicePort" . }}
      targetPort: direct
      protocol: TCP
    {{- end }}
