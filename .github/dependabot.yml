# Dependabot version updates: once a month, minor and patch updates grouped into one pull request
# per ecosystem (a major update gets its own), and a release must be a week old before it is
# proposed. THIRD_PARTY_NOTICES.md lists no versions, so a bump changes it only when a package or a
# licence does; `make check` fails a pull request whose notices are stale.
#
# Not covered here: the images and binaries pinned by digest or sha256 in .github/workflows/ci.yml,
# scripts/ci/*.sh and mise.toml; update those by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # The app (go.mod) and the build tools (tools/go.mod).
  - package-ecosystem: gomod
    directories: [/, /tools]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # The Dockerfile's base images, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
