name: release-announce

# Posts a published GitHub release, with its notes, to Discord. The steps are the shared
# release-announce workflow in the owner's .github repository, pinned to a commit; the webhook URL
# is the repository secret DISCORD_RELEASES_WEBHOOK, passed by name.
#
# The release of a tag is announced by ci.yml's announce job, not from here: ci.yml makes that
# release with the workflow's own token, for which GitHub starts no workflow. This one covers the
# rest: a release published by hand (after a release job that failed, say) starts it, and a manual
# run announces an existing release again. Keep its pin the same as ci.yml's.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to announce, for example v0.16.1
        required: true
        type: string

permissions: {}

jobs:
  announce:
    permissions:
      contents: read
    uses: TechDufus/.github/.github/workflows/release-announce.yml@f7202aa0c9295ebaba3f1161e1dba39b8d0e1ff1
    with:
      # Empty for a release event: the shared workflow then takes the release's own tag.
      tag: ${{ inputs.tag }}
    secrets:
      discord_webhook: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
