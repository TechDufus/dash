name: ci
# Runners. While the repository is private, pushes to main and v* tags run check, scan, smoke
# and kind on the self-hosted runner and pull requests run nothing, Dependabot's included (their
# checks show as skipped): only collaborators can open a pull request, and no pull request's code
# runs on the self-hosted runner (design G.8), nor are GitHub-hosted minutes spent on them before
# the repository is public. The release job always runs on ubuntu-24.04 (design H.2). That
# guarantee holds only while the repository is private: a fork's pull request runs the workflow
# file of its own branch, which could ask for the self-hosted labels. So before the flip, P6.9
# deregisters that runner. Once public, every job runs on ubuntu-24.04, for pushes and pull
# requests alike, with no edit here.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
# No token permission by default; each job asks for what it needs.
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request cancels its running checks. A main or tag run in progress always
  # finishes, but GitHub still cancels an older one that is only queued when a newer one arrives.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.repository.private
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64","homelab","dash"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # No Actions cache: the workflow also runs for release tags, and a cache written by
          # another run could poison what a tag builds (zizmor cache-poisoning).
          cache: false
      # The link check's lychee, like the scan job's binaries, comes from the job's temp dir:
      # downloaded and verified afresh, never a copy a self-hosted runner kept.
      - run: make check
        env:
          SCAN_TOOLS_DIR: ${{ runner.temp }}/scan-tools
      # Proves the image cross-compiles for both platforms without emulation, whether or not the
      # runner has emulators registered: every RUN must execute on the build platform
      # (linux/amd64, or linux/amd64->arm64 for the cross-compiling stage), and the arm64 Go
      # build must be one of them. Nothing is pushed or loaded.
      - name: Build the image for linux/amd64 and linux/arm64 (not pushed)
        run: |
          set -euo pipefail
          builder=dash-multiarch-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          log=$RUNNER_TEMP/multiarch.log
          trap 'docker buildx rm --force "$builder" >/dev/null 2>&1 || true' EXIT
          docker buildx create --name "$builder" --driver docker-container \
            --driver-opt image=moby/buildkit:v0.26.3@sha256:5601811fde88bb9e8a577bfe804af82bccb712e1cd07ff94663bded5e628cf75
          docker buildx build --builder "$builder" --platform linux/amd64,linux/arm64 \
            --output type=cacheonly --progress plain . 2>&1 | tee "$log"
          runs=$(grep -E '^#[0-9]+ \[[^]]*\] RUN' "$log" || true)
          emulated=$(grep -vE '^#[0-9]+ \[linux/amd64[] -]' <<<"$runs" || true)
          if [[ -n $emulated ]]; then
            echo "::error::a RUN step ran on the target platform (emulated):"; echo "$emulated"; exit 1
          fi
          grep -qE '^#[0-9]+ \[linux/amd64->arm64 go [0-9/]+\] RUN .*GOARCH=arm64' <<<"$runs" \
            || { echo "::error::no cross-compiling arm64 Go build in the log"; exit 1; }
  # make scan: gitleaks and trufflehog over the whole history (fetch-depth 0 brings every branch
  # and tag), govulncheck, actionlint, zizmor and the web links of the docs (lychee). The binaries
  # are pinned by sha256 in scripts/ci/tools.sh; SCAN_TOOLS_DIR in the job's temp dir makes every
  # run download and verify them afresh, never reuse a copy a self-hosted runner kept.
  scan:
    if: github.event_name != 'pull_request' || !github.event.repository.private
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64","homelab","dash"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - run: make scan
        env:
          SCAN_TOOLS_DIR: ${{ runner.temp }}/scan-tools
  # examples/compose end to end: the image built from this checkout, the monitoring profile, the
  # setup token, the settings API, the prometheus plugin turning healthy and dash's connection
  # test querying the compose Prometheus. The script removes its project, volume, network and
  # image on exit.
  smoke:
    needs: check
    if: github.event_name != 'pull_request' || !github.event.repository.private
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64","homelab","dash"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose smoke test
        env:
          PROMETHEUS_IMAGE: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
          ALERTMANAGER_IMAGE: prom/alertmanager:v0.29.0@sha256:88743b63b3e09ea6e31e140ced5bf45f4a8e82c617c2a963f78841f4995ad1d7
        run: scripts/ci/compose-smoke.sh
      - name: Read-only run without a volume
        run: scripts/ci/readonly-smoke.sh
  # The Helm chart and examples/kubernetes (docs/deploy/kubernetes.md) on the last three
  # Kubernetes minors kind supports (design J.18), each node image pinned by digest from the kind
  # release notes. make check already lints and renders the chart's five value sets and fails
  # when examples/kubernetes drifts from it; each leg validates the rendered objects against its
  # minor's schemas, then installs both paths on a throwaway kind cluster with the Gateway API and
  # Flux CRDs and the image built from this checkout. The script deletes its cluster, network and
  # image on exit; a cancelled job never reaches that trap, so the last step removes them by name
  # (unique per leg) whatever happened.
  kind:
    name: kind (Kubernetes ${{ matrix.kubernetes }})
    needs: check
    if: github.event_name != 'pull_request' || !github.event.repository.private
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64","homelab","dash"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: 1.37.0
            node: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          - kubernetes: 1.36.4
            node: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - kubernetes: 1.35.8
            node: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    env:
      DASH_KIND_NAME: dash-kind-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      KUBERNETES_VERSION: ${{ matrix.kubernetes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - name: kubeconform the rendered chart and examples/kubernetes
        run: |
          set -euo pipefail
          # Both schema sets pinned to a commit. The CRD catalog validates the sidecar and direct
          # sets' HTTPRoutes.
          k8s='https://raw.githubusercontent.com/yannh/kubernetes-json-schema/86d045595d3f93b703bbf439cf9eb4bd6830d58f/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json'
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/c86448cbf1a840ca62d119259864863897c8748a/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for set in default readonly actions sidecar direct; do
            echo "$set:"
            helm template dash charts/dash --namespace dash -f "charts/dash/ci/$set-values.yaml" |
              kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" -schema-location "$k8s" -schema-location "$crds" -
          done
          echo "examples/kubernetes:"
          kubectl kustomize examples/kubernetes |
            kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" -schema-location "$k8s" -
      - name: Install on kind (helm and kubectl apply -k)
        env:
          KIND_NODE_IMAGE: ${{ matrix.node }}
        run: scripts/ci/kind-smoke.sh
      - name: Remove the kind cluster, its network and the image
        if: always()
        run: |
          kind delete cluster --name "$DASH_KIND_NAME" --kubeconfig "$RUNNER_TEMP/kind-cleanup.kubeconfig" || true
          docker network rm "$DASH_KIND_NAME" || true
          docker image rm "dash:kind-$DASH_KIND_NAME" || true
  # Tag-only and GitHub-hosted (design H.2): the multi-arch image and the chart go to GHCR, with
  # GitHub attestations (build provenance and an SPDX SBOM, once the repository is public) and a
  # keyless cosign signature of the image digest. Both pushes come first, so a later step that
  # fails leaves a complete release to sign or attest by hand rather than half of one; X.Y.Z stays
  # create-only, so a failed push needs a new patch version. The release environment's required
  # reviewer approves each run before it gets its token; a pull request never reaches this job.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, scan, smoke, kind]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/techdufus/dash
      CHARTS: oci://ghcr.io/techdufus/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The chart and the image share one version (charts/dash/Chart.yaml): a tag that does not
      # name it would ship an image the chart does not run.
      - name: The tag is vX.Y.Z and matches the chart's version and appVersion
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be vX.Y.Z"; exit 1; }
          chart=$(awk '$1 == "version:" { print $2 }' charts/dash/Chart.yaml)
          app=$(awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2 }' charts/dash/Chart.yaml)
          if [[ $chart != "$version" || $app != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME, but charts/dash/Chart.yaml has version $chart and appVersion $app"
            exit 1
          fi
          { echo "VERSION=$version"; echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.26.3@sha256:5601811fde88bb9e8a577bfe804af82bccb712e1cd07ff94663bded5e628cf75
          cache-binary: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: helm
          cache: false
      - name: Log Helm in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      # X.Y.Z is create-only for the image and the chart: a version is never pushed twice. X.Y and
      # latest move by design.
      - name: Refuse a version already published
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists; tag a new version"; exit 1
          fi
          if helm show chart "$CHARTS/dash" --version "$VERSION" >/dev/null 2>&1; then
            echo "::error::$CHARTS/dash:$VERSION already exists; tag a new version"; exit 1
          fi
      # X.Y.Z, X.Y and latest; no X tag while dash is 0.x (decision J.19). The annotations sit on
      # the index too, so GHCR shows the multi-arch package's source and description.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          flavor: latest=auto
      # The Dockerfile cross-compiles from the build platform, so neither platform is emulated
      # (the check job proves it on every push).
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
            CREATED=${{ env.CREATED }}
          provenance: mode=max
          sbom: true
      - name: Push the chart
        run: |
          set -euo pipefail
          helm package charts/dash --destination "$RUNNER_TEMP/chart"
          helm push "$RUNNER_TEMP/chart/dash-$VERSION.tgz" "$CHARTS"
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "image: $IMAGE:$VERSION@$DIGEST"
          {
            echo "image: \`$IMAGE:$VERSION@$DIGEST\`"
            echo
            echo "chart: \`$CHARTS/dash --version $VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # GitHub's artifact attestations need a public repository on this plan; while it is private
      # these three steps are skipped and the image carries BuildKit's provenance and SBOM only.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Generate the SPDX SBOM
        if: ${{ !github.event.repository.private }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the SBOM
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image digest (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
