# tygo writes its own "Code generated by tygo. DO NOT EDIT." header.
#
# One entry per Go model package. The shared types live in internal/model. A plugin that owns
# types of its own gets its own entry, added by the change that creates its package
# (internal/plugins/<id>/model), so its types land beside its SPA module:
#
#   - path: github.com/TechDufus/dash/internal/plugins/<id>/model
#     output_path: web/src/plugins/modules/<id>/model.gen.ts
#     enum_style: union
#     type_mappings:
#       time.Time: string
#
# The module then declares `topics: { "<id>.<topic>": topic<Type>() }` with the generated type.
# make check fails when a generated file differs from what tygo writes or is not committed, and
# when a Go Topic* constant has no declaration (plugins/topic-data.ts).
#
# A plugin model package is an import leaf: it imports only the standard library, because
# internal/model.TopicTypes names the payload type of every topic and so imports it
# (TestPluginModelPackagesAreImportLeaves). A payload that needs a core type (Link, Health,
# SourceStatus) therefore stays in internal/model. For a plugin type that is not a topic payload
# and does need core types, the recipe, checked with tygo v0.2.21 in a scratch copy: tygo writes
# a selector type such as model.Health by looking up its source text in type_mappings, and as
# `any /* model.Health */` when there is none, so list every core type the package uses and
# import them in the frontmatter:
#
#     type_mappings:
#       time.Time: string
#       model.Health: Health
#       model.Link: Link
#       model.LinkKind: LinkKind
#       model.SourceStatus: SourceStatus
#     frontmatter: 'import type { Health, Link, LinkKind, SourceStatus } from "@/api/types";'
#
# The mapping key is the identifier as written in the Go source, so a package uses one alias for
# the core model package; pointers, slices and maps of a mapped type come out as plain TypeScript.
packages:
  - path: github.com/TechDufus/dash/internal/model
    output_path: web/src/api/types.ts
    enum_style: union
    type_mappings:
      time.Time: string
  - path: github.com/TechDufus/dash/internal/plugins/proxmox/model
    output_path: web/src/plugins/modules/proxmox/model.gen.ts
    enum_style: union
    type_mappings:
      time.Time: string
  - path: github.com/TechDufus/dash/internal/plugins/hardware/model
    output_path: web/src/plugins/modules/hardware/model.gen.ts
    enum_style: union
    type_mappings:
      time.Time: string
