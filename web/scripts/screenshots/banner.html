<!doctype html>
<!-- The README banner (docs/images/banner.png), rendered by scripts/screenshots.mjs at 1280x640,
     device scale 2. The script serves this page, the two bundled fonts and a fresh overview
     screenshot (overview.png) under /__banner/. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dash banner</title>
    <style>
      @font-face {
        font-family: "Inter Variable";
        font-weight: 100 900;
        src: url("inter.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono Variable";
        font-weight: 100 800;
        src: url("jetbrains-mono.woff2") format("woff2");
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: "Inter Variable", sans-serif;
        color: #e9eef6;
        background:
          radial-gradient(ellipse 720px 420px at 88% 8%, rgb(34 211 238 / 0.13), transparent 70%),
          radial-gradient(ellipse 520px 380px at 12% 55%, rgb(34 211 238 / 0.05), transparent 70%),
          #05070c;
      }
      .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgb(148 163 184 / 0.16) 1px, transparent 1px);
        background-size: 22px 22px;
        mask-image: linear-gradient(100deg, transparent 30%, black 75%);
      }
      .hero {
        position: absolute;
        left: 72px;
        top: 130px;
        width: 520px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 6px 15px 6px 13px;
        border: 1px solid rgb(148 163 184 / 0.22);
        border-radius: 999px;
        background: rgb(15 23 42 / 0.6);
        font: 500 13px/1.2 "JetBrains Mono Variable", monospace;
        letter-spacing: 0.16em;
        color: #9aa6b8;
      }
      .pill i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3ee69a;
        box-shadow: 0 0 8px rgb(62 230 154 / 0.9);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 22px;
        margin-top: 26px;
        font-size: 112px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .logo i {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #38d6f5;
        box-shadow:
          0 0 0 8px rgb(56 214 245 / 0.12),
          0 0 36px rgb(56 214 245 / 0.7);
      }
      h1 {
        margin-top: 34px;
        font-size: 34px;
        font-weight: 650;
        line-height: 1.15;
        letter-spacing: -0.01em;
      }
      h1 em {
        font-style: normal;
        color: #38d6f5;
      }
      p {
        margin-top: 20px;
        font-size: 17px;
        line-height: 1.6;
        color: #8c97a8;
      }
      .chips {
        display: flex;
        gap: 9px;
        margin-top: 24px;
      }
      .chips span {
        padding: 6px 11px;
        border: 1px solid rgb(148 163 184 / 0.2);
        border-radius: 7px;
        background: rgb(15 23 42 / 0.55);
        font: 500 13px/1.2 "JetBrains Mono Variable", monospace;
        color: #c5cdd9;
      }
      .stage {
        position: absolute;
        left: 640px;
        top: 96px;
        perspective: 1800px;
      }
      .window {
        width: 1000px;
        border: 1px solid rgb(148 163 184 / 0.22);
        border-radius: 14px;
        overflow: hidden;
        background: #090c12;
        transform: rotateY(-14deg) rotateX(4deg) rotateZ(-1deg);
        transform-origin: left center;
        box-shadow:
          0 40px 80px rgb(0 0 0 / 0.6),
          0 0 60px rgb(56 214 245 / 0.08);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 14px;
        border-bottom: 1px solid rgb(148 163 184 / 0.14);
        background: #0d1118;
      }
      .bar i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #2a313d;
      }
      .bar span {
        margin-left: 16px;
        padding: 3px 12px;
        border-radius: 6px;
        background: #161c26;
        font: 500 12px/1.4 "JetBrains Mono Variable", monospace;
        color: #9aa6b8;
      }
      .window img {
        display: block;
        width: 1000px;
        height: 625px;
      }
    </style>
  </head>
  <body>
    <div class="dots"></div>
    <div class="hero">
      <div class="pill"><i></i>HOMELAB MISSION CONTROL</div>
      <div class="logo"><i></i>dash</div>
      <h1>Your whole homelab,<br /><em>live</em> on one screen.</h1>
      <p>
        Proxmox, Kubernetes, Flux, storage, alerts and service<br />status in one Go binary,
        streamed live over SSE.
      </p>
      <div class="chips">
        <span>Go</span><span>client-go</span><span>SSE</span><span>React 19</span
        ><span>Tailwind v4</span><span>Flux</span>
      </div>
    </div>
    <div class="stage">
      <div class="window">
        <div class="bar"><i></i><i></i><i></i><span>dash · overview</span></div>
        <img src="overview.png" alt="" />
      </div>
    </div>
  </body>
</html>
