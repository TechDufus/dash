# Infrastructure links for the launcher (Overview and Apps), read from the file that
# plugins.launcher.file (DASH_PLUGINS_LAUNCHER_FILE) points at when the launcher starts.
# icon is a name from https://github.com/homarr-labs/dashboard-icons (it is shown from
# ui.iconBaseURL, DASH_UI_ICON_BASE_URL: without one the link gets a letter tile), a same-origin
# path, or an image URL under ui.iconBaseURL; leave it out for a letter tile. href must be http or
# https.
- name: Proxmox
  href: https://pve.example.com:8006
  icon: proxmox
  description: Hypervisor
- name: BMC
  href: https://bmc.example.com
  icon: idrac
  description: Out-of-band management
- name: Router
  href: https://192.0.2.1
  icon: unifi
  description: Network
- name: GitOps repo
  href: https://github.com/example/homelab
  icon: github
  description: Cluster config
