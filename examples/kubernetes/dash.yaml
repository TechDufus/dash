    helm.sh/chart: dash-0.14.5
    app.kubernetes.io/name: dash
    app.kubernetes.io/instance: dash
    app.kubernetes.io/version: "0.14.5"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  # Always Recreate: the data volume holds one dash's state, and during a rolling update two pods
  # on one node can both mount a ReadWriteOnce volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dash
      app.kubernetes.io/instance: dash
  template:
    metadata:
      annotations:
        # A config change restarts dash, so restart-only settings apply too.
        checksum/config: 78ad8dbf0f3cb02888f2701714905141c079786a0a259fb5810085cdf3ef11c9
      labels:
        app.kubernetes.io/name: dash
        app.kubernetes.io/instance: dash
    spec:
      serviceAccountName: dash
      automountServiceAccountToken: true
      # Service links would add DASH_PORT, DASH_SERVICE_HOST and the like for a Service named
      # dash, and dash reads every DASH_* variable as a setting.
      enableServiceLinks: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dash
          image: ghcr.io/techdufus/dash:0.14.5
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
            - name: DASH_CONFIG
              value: /etc/dash/config.yaml
            - name: DASH_SERVER_LISTEN
              value: "0.0.0.0:8080"
            # The probes below need the health listener on the pod's address.
            - name: DASH_SERVER_HEALTH_LISTEN
              value: "0.0.0.0:8081"
            - name: DASH_SETTINGS_UI
              value: "editable"
            - name: DASH_SECRET_KEY_FILE
              value: /run/secrets/dash/secret-key
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          # /readyz answers 503 for up to server.readyTimeout (1m by default) while the plugins in
          # server.readyRequires start; the startup probe allows 2 minutes.
          startupProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/dash
              readOnly: true
            - name: data
              mountPath: /data
            - name: secret-key
              mountPath: /run/secrets/dash
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dash
        - name: data
          persistentVolumeClaim:
            claimName: dash-data
        - name: secret-key
          secret:
            secretName: dash-secret-key
            items:
              - key: secretKey
                path: secret-key
            defaultMode: 0440
