# dash with Docker Compose. See docs/deploy/docker.md.
#
#   mkdir -p -m 0700 secrets && openssl rand -base64 32 > secrets/dash_secret_key && chmod 0644 secrets/dash_secret_key   # dash (uid 65532) reads it through a bind mount
#   docker compose up -d                         # dash alone
#   docker compose --profile monitoring up -d    # dash, Prometheus and Alertmanager
#
# The variables in ${…} have defaults; the CI smoke test (scripts/ci/compose-smoke.sh) overrides
# them to run a locally built image on a free port.
name: dash

services:
  dash:
    image: ${DASH_IMAGE:-ghcr.io/techdufus/dash:0.14.5}
    restart: unless-stopped
    # Loopback only: put a TLS reverse proxy in front to serve other machines.
    ports: ["127.0.0.1:${DASH_PORT:-8080}:8080"]
    environment:
      # The URL people open; the only Host and Origin the API accepts.
      DASH_SERVER_PUBLIC_URL: http://localhost:${DASH_PORT:-8080}
      DASH_SECRET_KEY_FILE: /run/secrets/dash_secret_key
      # Uncomment to configure the plugins here instead of on the settings page (the environment
      # wins over the page, and the page then shows the field as set by the environment):
      # DASH_PLUGINS_PROMETHEUS_URL: http://prometheus:9090
      # DASH_PLUGINS_ALERTMANAGER_URL: http://alertmanager:9093
    secrets: [dash_secret_key]
    volumes: ["dash-data:/data"]

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.7.3}
    profiles: [monitoring]
    restart: unless-stopped
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.29.0}
    profiles: [monitoring]
    restart: unless-stopped

secrets:
  dash_secret_key:
    file: ${DASH_SECRET_KEY_PATH:-./secrets/dash_secret_key}

volumes:
  dash-data:
